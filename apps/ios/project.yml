name: ThinkLot
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.1
settings:
  base:
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: ''
targets:
  ThinkLot:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ConvexMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thinklot.native
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ThinkLotConvexURL: $(THINKLOT_CONVEX_URL)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
  ThinkLotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ThinkLot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.thinklot.native.tests
schemes:
  ThinkLot:
    build:
      targets:
        ThinkLot: all
    test:
      targets: [ThinkLotTests]
