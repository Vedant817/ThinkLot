<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><title>ThinkLot</title><rect width="1024" height="1024" fill="#141418"/>
  <!-- top of T: generous, precise quarter-rounds -->
  <rect x="258" y="279" width="365" height="99" rx="18" fill="#F4F4F1"/>
  <!-- right-hand signal: the one idea singled out for action -->
  <rect x="650" y="279" width="116" height="99" rx="18" fill="#8B7CF6"/>
  <!-- stem connects upper capture bar to lower execution baseline -->
  <rect x="372" y="337" width="108" height="389" rx="18" fill="#F4F4F1"/>
  <!-- L: output / execution baseline -->
  <rect x="372" y="627" width="394" height="99" rx="18" fill="#F4F4F1"/>
</svg>
